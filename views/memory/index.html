<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记忆演化</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="bar-left">
        <h1>记忆演化</h1>
        <span class="hint" id="scope-hint">加载中…</span>
      </div>
      <div class="bar-right">
        <select id="scope" title="会话"></select>
        <button id="refresh" class="btn">刷新</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="facts">记忆</button>
      <button class="tab" data-tab="persona">人格</button>
      <button class="tab" data-tab="care">主动消息</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>

    <section class="panel" id="panel-facts">
      <div class="toolbar">
        <input id="q" type="search" placeholder="搜内容，如 香菜 / 作息" />
        <select id="kind">
          <option value="">全部类型</option>
          <option value="preference">偏好</option>
          <option value="profile">资料</option>
          <option value="fact">事实</option>
          <option value="event">事件</option>
          <option value="task">任务</option>
        </select>
        <select id="status">
          <option value="">全部状态</option>
          <option value="active">有效</option>
          <option value="suspect">待确认</option>
          <option value="superseded">已取代</option>
        </select>
        <button id="search" class="btn">搜索</button>
        <span class="spacer"></span>
        <button id="confirm-selected" class="btn ghost">确认选中</button>
        <button id="delete-selected" class="btn danger">删除选中</button>
        <button id="export" class="btn ghost">导出 JSON</button>
      </div>
      <div class="table-wrap">
        <table id="facts-table">
          <thead>
            <tr>
              <th class="c"><input type="checkbox" id="check-all" /></th>
              <th class="c">#</th>
              <th>内容</th>
              <th class="c">类型</th>
              <th class="c">重要</th>
              <th class="c">置信</th>
              <th class="c">召回</th>
              <th class="c">状态</th>
              <th class="c">更新时间</th>
            </tr>
          </thead>
          <tbody id="facts-body"></tbody>
        </table>
        <p class="empty" id="facts-empty" hidden>这个会话还没有记忆。</p>
      </div>
      <div class="pager">
        <button id="prev" class="btn ghost">上一页</button>
        <span id="pager-info" class="hint"></span>
        <button id="next" class="btn ghost">下一页</button>
      </div>
    </section>

    <section class="panel" id="panel-persona" hidden>
      <div id="persona-traits" class="traits"></div>
      <h2 class="sub">演化记录</h2>
      <ul id="persona-log" class="timeline"></ul>
    </section>

    <section class="panel" id="panel-care" hidden>
      <div class="care-grid" id="care-grid"></div>
      <div class="care-actions">
        <button id="care-toggle" class="btn">切换本会话</button>
        <p class="hint">总开关在插件配置里（care_enable）。这里只控制这个会话。</p>
      </div>
    </section>

    <section class="panel" id="panel-settings" hidden>
      <div class="toolbar">
        <span class="spacer"></span>
        <button id="settings-defaults" class="btn ghost">填入默认值</button>
        <button id="settings-save" class="btn">保存设置</button>
      </div>
      <p class="hint">这里的改动写回插件配置文件，保存后立即生效；标「需重启」的要重启 AstrBot。</p>
      <div id="settings-groups"></div>
    </section>

    <p class="toast" id="toast" hidden></p>
    <script type="module" src="./app.js"></script>
  </body>
</html>
